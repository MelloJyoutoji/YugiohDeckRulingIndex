                    <div class="entry__content">
                        <h2>裁定</h2>
                        <div id="ars-magna-ruling" class="auto-number">
                        </div>

                        <h2>持续适用的效果</h2>
                        <div id="ars-magna-continuous-effects" class="auto-number">
                            <p>
                                「无限与有限之无垢大艺术」(大拳头)①效果发动后, 有「狱神」Link攻击力变成3倍的效果.
                            </p>
                            <p>
                                「净化与腐败之无垢大艺术」(龙)①效果发动后, 有两个回合的「狱神」Link战破保护.
                            </p>
                            <p>
                                「结合与乖离之无垢大艺术」(猫)①效果发动后, 「狱神」Link可以向怪兽打三拳.
                            </p>
                        </div>

                        <h2>注意</h2>
                        <div id="ars-magna-notes" class="auto-number">
                            <p>
                                「无限与有限之无垢大艺术」(大拳头)③效果自己必须有「狱神」Link才能开.
                            </p>
                            <p>
                                「无垢祈祷之狱神使」检索效果需要墓地有「狱神」才能开. 加速效果必须有其他暗天使才能开.
                            </p>
                        </div>

                        <h2>召唤条件</h2>
                        <div id="ars-magna-summon-conditions" class="auto-number">
                            <p>
                                「无垢祈祷之狱神使」不能使用连接怪兽作为素材.
                            </p>
