<!DOCTYPE html>
<html class="no-js" lang="zh-CN">
<head>

    <!-- 基础信息：页面标题同时供首页卡片和导航读取 -->
    <meta charset="utf-8">
    <title>磁石战士</title>
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 公共样式及构筑预览样式 -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/vendor.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/deck-viewer.css">

    <script src="../js/modernizr.js"></script>

    <!-- 站点图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="../srds.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="../srds.jpg">
    <link rel="icon" type="image/png" sizes="16x16" href="../srds.jpg">
    <link rel="manifest" href="../site.webmanifest">

</head>

<body class="ss-bg-white">

    <div id="top" class="s-wrap site-wrapper">

        <!-- 公共导航 -->
        <div id="header-placeholder"></div>

        <!-- 磁石战士系列内容 -->
        <div class="s-content content">
            <main class="row content__page">

                <article class="column large-full entry format-standard">

                    <!-- 根据页面文件名自动加载 Magnet-2000.jpg -->
                    <div class="media-wrap entry__media">
                        <div class="entry__post-thumb" style="text-align: center;">
                            <img data-deck-image
                                sizes="(max-width: 2000px) 100vw, 2000px" alt="磁石战士">
                        </div>
                    </div>

                    <div class="content__page-header entry__header">
                        <h1 class="display-1 entry__title" data-deck-name></h1>
                        <ul class="entry__header-meta">
                            <li class="author">By <a href="https://space.bilibili.com/18234381">梅洛</a></li>
                        </ul>
                    </div>

                    <div class="entry__content">
                        <!-- 裁定资料待补充，沿用现有系列页面的分类 -->
                        <h2>裁定</h2>
                        <div class="auto-number">
                        </div>

                        <h2>注意</h2>
                        <div class="auto-number">
                        </div>

                        <h2>自肃</h2>
                        <div class="auto-number">
                        </div>

                        <h2>召唤条件</h2>
                        <div class="auto-number">
                        </div>

                        <!-- 构筑由公共脚本根据“磁石”系列映射加载 -->
                        <div id="deck-raw" style="display:none;">
                        </div>

                        <div id="deck-render"></div>

                        <!-- 卡片详情悬浮预览 -->
                        <div id="card-hover">
                            <iframe></iframe>
                        </div>

                    </div>

                </article>

            </main>

        </div>

        <!-- 公共页脚 -->
        <div id="footer-placeholder"></div>

    </div>

    <!-- 公共交互、页面名称和构筑预览 -->
    <script src="../js/jquery-3.2.1.min.js"></script>
    <script src="../js/plugins.js"></script>
    <script src="../js/deck-names.js"></script>
    <script src="../js/main.js?v=0120fix"></script>
    <script src="../js/deck-viewer.js"></script>
    <script src="../js/mc-deck-previews.js"></script>

</body>
</html>
