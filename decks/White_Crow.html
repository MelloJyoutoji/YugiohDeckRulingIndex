    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/vendor.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/deck-viewer.css">

    <!-- script

    <!-- favicons

    <link rel="apple-touch-icon" sizes="180x180" href="../srds.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="../srds.jpg">

<body class="ss-bg-white">

    <div id="top" class="s-wrap site-wrapper">

        <!-- site header
        ================================================== -->
        <div id="header-placeholder"></div>

        <!-- site content
        ================================================== -->
        <div class="s-content content">
            <main class="row content__page">
                
                <article class="column large-full entry format-standard">

                    <div class="media-wrap entry__media">
                        <div class="entry__post-thumb" style="text-align: center;">
                            <img data-deck-image
                                sizes="(max-width: 2000px) 100vw, 2000px" alt="">
                        </div>
                    </div>

                    <div class="content__page-header entry__header">
                        <h1 class="display-1 entry__title" data-deck-name></h1>
                        <ul class="entry__header-meta">
                            <li class="author">By <a href="https://space.bilibili.com/18234381">梅洛</a></li>
                            <!-- <li class="cat-links">
                                <a href="#0">Marketing</a><a href="#0">Management</a>
                            </li> -->
                        </ul>
                    </div> <!-- end entry__header -->

                    <div class="entry__content" data-ruling-layout="axes">
                        <section class="ruling-section" data-ruling-section="ruling">
                            <h2>裁定</h2>
                            <details class="ruling-fold">
                                <summary>展开裁定</summary>
                                <div class="ruling-fold__content">
                                    <div class="ruling-axes">
                                        <details class="ruling-axis" data-ruling-page="White_Crow.html">
                                            <summary>白鸦</summary>
                                            <div class="auto-number" id="white-crow-ruling-own" data-ruling-own="true">
                                        <p>无</p>
                                            </div>
                                        </details>
                                    </div>
                                </div>
                            </details>
                        </section>

                        <section class="ruling-section" data-ruling-section="notes">
                            <h2>注意</h2>
                            <details class="ruling-fold">
                                <summary>收起注意</summary>
                                <div class="ruling-fold__content">
                                    <div class="ruling-axes">
                                        <details class="ruling-axis" data-ruling-page="White_Crow.html">
                                            <summary>白鸦</summary>
                                            <div class="auto-number" id="white-crow-notes-own" data-ruling-own="true">
                                        <p>无</p>
                                            </div>
                                        </details>
                                    </div>
                                </div>
                            </details>
                        </section>

                        <section class="ruling-section" data-ruling-section="continuous-effects">
                            <h2>持续适用的效果</h2>
                            <!-- 五栏统一使用整栏折叠，首次加载默认收起。 -->
                            <details class="ruling-fold">
                                <summary>持续适用的效果</summary>
                                <div class="ruling-fold__content">
                                    <div class="ruling-axes">
                                        <details class="ruling-axis" data-ruling-page="White_Crow.html">
                                            <summary>白鸦</summary>
                                            <div class="auto-number" id="white-crow-continuous-effects-own" data-ruling-own="true">
                                                <p>无</p>
                                            </div>
                                        </details>
                                    </div>
                                </div>
                            </details>
                            </section>

                        <section class="ruling-section" data-ruling-section="restrictions">
                            <h2>自肃</h2>
                            <!-- 五栏统一使用整栏折叠，首次加载默认收起。 -->
                            <details class="ruling-fold">
                                <summary>自肃</summary>
                                <div class="ruling-fold__content">
                                    <div class="ruling-axes">
                                        <details class="ruling-axis" data-ruling-page="White_Crow.html">
                                            <summary>白鸦</summary>
                                            <div class="auto-number" id="white-crow-restrictions-own" data-ruling-own="true">
                                                <p>无</p>
                                            </div>
                                        </details>
                                    </div>
                                </div>
                            </details>
                            </section>

                        <section class="ruling-section" data-ruling-section="summon-conditions">
                            <h2>召唤条件</h2>
                            <!-- 五栏统一使用整栏折叠，首次加载默认收起。 -->
                            <details class="ruling-fold">
                                <summary>召唤条件</summary>
                                <div class="ruling-fold__content">
                                    <div class="ruling-axes">
                                        <details class="ruling-axis" data-ruling-page="White_Crow.html">
                                            <summary>白鸦</summary>
                                            <div class="auto-number" id="white-crow-summon-conditions-own" data-ruling-own="true">
                                                <p>无</p>
                                            </div>
                                        </details>
                                    </div>
                                </div>
                            </details>
                            </section>

                        </div> <!-- end entry content -->

                    
                </article> <!-- end column large-full entry-->

            </main>

        </div> <!-- end s-content -->


        <!-- footer
        ================================================== -->
        <div id="footer-placeholder"></div>

    </div> <!-- end s-wrap -->
